<div class="relative bg-slate-900 rounded-xl p-4 border border-slate-800 shadow-lg min-h-[500px]">
    <h3 class="text-xl font-bold mb-4 text-blue-400 text-center">{{ title() }}</h3>
     <button (click)="onCreateTask($event)" class="absolute bottom-4 right-4 bg-pink-600 hover:bg-pink-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition-colors cursor-pointer">
        + Create Task
    </button>

    @if (isModalOpen()){
        <app-task-form-component (close)="onCloseModal()"></app-task-form-component>}
    
    @for (item of filteredTasks(); track $index) {
        <app-card-component [data]="item" (delete)="onDeleteTask($event)" class="block mb-4"></app-card-component>
    } @empty {
        <p class="text-xs text-slate-500 text-center py-8">No tasks yet.</p>
    }
</div>
