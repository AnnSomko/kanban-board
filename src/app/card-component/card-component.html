<div
  class="bg-yellow-100 flex flex-col justify-between rounded-xl p-4 border border-yellow-300 shadow-lg min-h-[200px] cursor-grab active:cursor-grabbing"
>
  <div>
    <h3 class="text-md font-bold text-slate-800 text-center mb-1 line-clamp-2">{{data()?.title}}</h3>
    <p class="text-sm text-slate-500 line-clamp-3"><b>Description:</b> {{data()?.description}}</p>
    <p class="text-sm text-slate-500"><b>Author:</b> {{data()?.author}}</p>
  </div>

  <div class="flex justify-end gap-3">
    <button class="bg-emerald-100 text-xs text-emerald-700 hover:text-emerald-200 border border-emerald-300 transition-colors px-2.5 py-1 rounded-md cursor-pointer">Edit</button>
    <button class="bg-rose-100 text-xs text-rose-700 hover:text-rose-200 border border-rose-300 transition-colors px-2.5 py-1 rounded-md cursor-pointer">Delete</button>
  </div>
</div>
